    <h1>《切韻》書影</h1>
    <p>
      《切韵》是隋代陆法言作于隋文帝仁寿元年（公元601年）的一部韵书，全书共五卷，收1.15万字，分193韵：平声54韵，上声51韵，去声56韵，入声32韵。目前《切韵》原本已亡佚，目前可见《切韵》均为残卷，其中最著名的敦煌文献S.2071，通称“切三”。唐代王仁昫《刊谬补缺切韵》是目前尚存最早的《切韵》系韵书，目前存世的唯一全本为唐写本（或称宋濂跋本），通称“王三”。
    </p>
